[project]
name = "mcp-deployment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "liu xiaohong", email = "xiaohong.cmi@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=2.2.0",
]

[project.scripts]
mcp-server = "mcp_deployment.__main__:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]








